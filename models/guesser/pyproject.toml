[project]
name = "guesser"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "guesser-data",
    "lightning>=2.6.6",
    "safetensors>=0.8.0",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.2",
]

[tool.uv.workspace]
members = [
    "data",
]

[tool.uv.sources]
guesser-data = { workspace = true, editable = true }
