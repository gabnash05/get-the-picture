[project]
name = "mtmai-guesser-evaluation"
version = "0.1.0"
description = "Cross-platform notebook environment for Guesser evaluation and inference work"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
inference = [
    "fastapi>=0.115,<1",
    "opencv-python-headless>=4.11,<5",
    "pydantic>=2.11,<3",
    "safetensors>=0.6,<1",
    "timm>=1.0,<2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
notebook = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "nbconvert>=7.16,<8",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "pillow>=13,<14",
    "scikit-learn>=1.7,<2",
]
dev = [
    "nbdime>=4,<5",
    "nbstripout>=0.8,<1",
    "pre-commit>=4,<5",
    "pytest>=9.0.3,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guesser_evaluation"]

[tool.uv]
default-groups = ["notebook", "dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
