<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1690" viewBox="0 0 2800 1690">
<rect width="100%" height="100%" fill="white"/>
<text x="70" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#0f172a" text-anchor="start">Reconnects and restarts | In-memory game server baseline</text>
<text x="70" y="131" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">Client resynchronization can use a surviving process. A game-process restart voids unfinished rounds; only committed saved results are restored.</text>
<polyline points="560,345 850,345" fill="none" stroke="#475569" stroke-width="3"/>
<polygon points="850,345 836.0,339.0 836.0,351.0" fill="#475569"/>
<polyline points="1450,345 1900,345" fill="none" stroke="#15803d" stroke-width="3"/>
<polygon points="1900,345 1886.0,339.0 1886.0,351.0" fill="#15803d"/>
<polyline points="320,480 320,800" fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="10 7"/>
<polygon points="320,800 326.0,786.0 314.0,786.0" fill="#be123c"/>
<polyline points="560,930 850,930" fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="10 7"/>
<polygon points="850,930 836.0,924.0 836.0,936.0" fill="#be123c"/>
<polyline points="1450,1020 1900,1020" fill="none" stroke="#475569" stroke-width="3"/>
<polygon points="1900,1020 1886.0,1014.0 1886.0,1026.0" fill="#475569"/>
<polygon points="1450,1020 1464.0,1026.0 1464.0,1014.0" fill="#475569"/>
<polyline points="2250,800 2250,480" fill="none" stroke="#15803d" stroke-width="3"/>
<polygon points="2250,480 2244.0,494.0 2256.0,494.0" fill="#15803d"/>
<rect x="80" y="220" width="480" height="260" rx="14" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
<text x="98" y="262" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Connection interrupted</text>
<text x="98" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Reconnect with stable guest identity</text>
<text x="98" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Present the last applied sequence</text>
<text x="98" y="361" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Socket ID is not the player identity</text>
<text x="98" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Check whether the game process survived</text>
<text x="98" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Bound reconnect grace by the deadline</text>
<rect x="850" y="220" width="600" height="260" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="868" y="262" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Same live NestJS process</text>
<text x="868" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Authoritative match state remains in RAM</text>
<text x="868" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Authenticate membership and role</text>
<text x="868" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Send a filtered snapshot + missing events</text>
<text x="868" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Deduplicate retries and detect sequence gaps</text>
<text x="868" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Require fresh rendered-view acknowledgements</text>
<rect x="1900" y="220" width="700" height="260" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1918" y="262" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Return to play</text>
<text x="1918" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Surviving process: resume the current challenge</text>
<text x="1918" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Restart: resume the saved match at a fresh round</text>
<text x="1918" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">All active guessers ACK their permitted view</text>
<text x="1918" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Bound reconnect grace by the round deadline</text>
<text x="1918" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Grace expires: the affected team forfeits</text>
<rect x="80" y="800" width="480" height="280" rx="14" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
<text x="98" y="842" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Game process restarted</text>
<text x="98" y="885" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Live match state and RAM buffers lost</text>
<text x="98" y="913" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">No automatic active-match failover</text>
<text x="98" y="941" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Assign a new server instance identity</text>
<text x="98" y="969" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Reject AI results from the old instance</text>
<text x="98" y="997" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Detect rounds without finalization</text>
<rect x="850" y="800" width="600" height="280" rx="14" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
<text x="868" y="842" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Void the interrupted round</text>
<text x="868" y="886" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Discard its provisional points and bonus</text>
<text x="868" y="915" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Retain committed finalized round scores</text>
<text x="868" y="944" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Retry the same match round position</text>
<text x="868" y="973" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Use a fresh prompt and round generation</text>
<text x="868" y="1002" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Do not advance the drawer rotation</text>
<rect x="1900" y="800" width="700" height="280" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<ellipse cx="2250.0" cy="818" rx="350.0" ry="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1918" y="870" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Saved records | PostgreSQL</text>
<text x="1918" y="916" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Match setup, team roster and finalized scores</text>
<text x="1918" y="945" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Archived round events and model inputs</text>
<text x="1918" y="974" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Flush events before finalizing a round</text>
<text x="1918" y="1003" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Unique round finalization / idempotent writes</text>
<text x="1918" y="1032" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Unflushed live events can be lost on restart</text>
<rect x="80" y="1250" width="780" height="240" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="98" y="1292" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Human lag / disconnect</text>
<text x="98" y="1336" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Affected team gets a bounded reconnect grace period.</text>
<text x="98" y="1365" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Other teams and the common round clock continue.</text>
<text x="98" y="1394" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Hold affected-team AI delivery until rendered catch-up.</text>
<text x="98" y="1423" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Grace expires: forfeit that team; cancel its AI jobs.</text>
<text x="98" y="1452" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">Normal reconnect depends on the live game process.</text>
<rect x="960" y="1250" width="780" height="240" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="978" y="1292" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">AI service outage</text>
<text x="978" y="1335" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Human speed points remain valid.</text>
<text x="978" y="1363" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Required guesser attempt unavailable: all round AI bonuses off.</text>
<text x="978" y="1391" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Bonuses stay provisional until round finalization.</text>
<text x="978" y="1419" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Normal cancellation after a solve is not a service outage.</text>
<text x="978" y="1447" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Referee outage: advisory flagging unavailable.</text>
<rect x="1840" y="1250" width="780" height="240" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1858" y="1292" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Persistence and scope</text>
<text x="1858" y="1335" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Live drawing is accepted in RAM and broadcast immediately.</text>
<text x="1858" y="1363" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">PostgreSQL writes are batched in background workers.</text>
<text x="1858" y="1391" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Flush round events, then commit the finalized result.</text>
<text x="1858" y="1419" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">The baseline uses one active NestJS game process.</text>
<text x="1858" y="1447" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Transparent server failover is outside this baseline.</text>
<rect x="626.0" y="303" width="158" height="32" fill="white"/>
<text x="705" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="middle">Process survived</text>
<rect x="1576.5" y="303" width="197" height="32" fill="white"/>
<text x="1675" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#15803d" text-anchor="middle">Authenticated resync</text>
<rect x="398.0" y="624" width="164" height="32" fill="white"/>
<text x="480" y="646" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#be123c" text-anchor="middle">Process restarted</text>
<rect x="631.5" y="888" width="147" height="32" fill="white"/>
<text x="705" y="910" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#be123c" text-anchor="middle">Void live round</text>
<rect x="1566.0" y="978" width="218" height="32" fill="white"/>
<text x="1675" y="1000" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="middle">Load committed results</text>
<rect x="2339.0" y="624" width="242" height="32" fill="white"/>
<text x="2460" y="646" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#15803d" text-anchor="middle">Saved match / fresh round</text>
<text x="70" y="1644" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">This baseline supports client reconnects while the backend is alive. Backend restart interrupts every active match hosted in that process.</text>
</svg>